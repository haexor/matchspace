<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchSpace · Spieler einzeln</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #101419; color: #e8eaed; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; background: rgba(16,20,25,.82); backdrop-filter: blur(4px); }
  #bar label { display: flex; gap: 6px; align-items: center; color: #9aa3ad; font-size: 12px; }
  select, input[type=range] { font: inherit; color: #e8eaed; background: #1d242b; border: 1px solid #2b323a; border-radius: 6px; padding: 3px 6px; }
  #status { color: #9aa3ad; font-size: 12px; margin-left: auto; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="bar">
  <b>Spieler</b>
  <label>Figur <select id="who"></select></label>
  <label>Pose (Bild) <input id="frame" type="range" min="0" max="0" value="0" step="1"></label>
  <label><input id="turn" type="checkbox" checked> Drehteller</label>
  <label><input id="tpose" type="checkbox"> T-Haltung</label>
  <label>Schicht <select id="layer"><option value="both">Figur mit Trikot</option><option value="skin">nackt (ohne Kleidung)</option><option value="cloth">nur Trikot, Hose, Stutzen</option></select></label>
  <label><input id="wire" type="checkbox"> Raster der Textur</label>
  <span id="status">Lade …</span>
</div>
<script type="module" src="spieler.js"></script>
</body>
</html>
